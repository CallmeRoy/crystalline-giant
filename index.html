</main>

  {id:'reach',       name:'Reach'},
  {id:'trample',     name:'Trample'},
  {id:'vigilance',   name:'Vigilance'},
  {id:'plus1',       name:'+1/+1'}
];
const BASE = {p:3, t:3};
const state = Object.fromEntries(COUNTERS.map(c => [c.id, false]));
let rolling = false, rollNo = 0;

const $ = id => document.getElementById(id);
const rules = $('rules'), statusEl = $('status'), logEl = $('log'), ptval = $('ptval');

COUNTERS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'zone sym'; b.style.position = 'relative';
  b.id = 'sym-' + c.id; b.setAttribute('aria-pressed','false');
  b.title = c.name + ' counter – click to add/remove';
  b.innerHTML = ICONS[c.id] + `<span>${c.name}</span>`;
  b.addEventListener('click', () => {
    if (rolling) return;
    state[c.id] = !state[c.id];
    setStatus(`${state[c.id] ? 'Added' : 'Removed'} ${c.name} counter manually.`);
    render(state[c.id] ? c.id : null);
  });
  rules.appendChild(b);
});

function render(newId){
  COUNTERS.forEach(c => {
    const el = $('sym-' + c.id);
    el.classList.toggle('on', state[c.id]);
    el.setAttribute('aria-pressed', String(state[c.id]));
    el.classList.remove('new');
    if (c.id === newId){ void el.offsetWidth; el.classList.add('new'); }
  });
  const bonus = state.plus1 ? 1 : 0;
  ptval.textContent = `${BASE.p + bonus}/${BASE.t + bonus}`;
  ptval.classList.toggle('buffed', bonus > 0);
}
function setStatus(t){ statusEl.textContent = t; }
function addLog(t){
  const li = document.createElement('li'); li.textContent = t;
  logEl.prepend(li);
  while (logEl.children.length > 10) logEl.lastChild.remove();
}
/* Unbiased random index using the browser's crypto RNG */
function randIndex(n){
  const a = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n;
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}

$('art').addEventListener('click', () => {
  if (rolling) return;
  const pool = COUNTERS.filter(c => !state[c.id]);   // only kinds it doesn't have
  rollNo++;
  if (!pool.length){
    setStatus('All 10 counter kinds are already on Crystalline Giant – the trigger does nothing.');
    addLog(`Roll ${rollNo}: no kind left – nothing happens`);
    return;
  }
  const pick = pool[randIndex(pool.length)];
  const finish = () => {
    pool.forEach(c => $('sym-' + c.id).classList.remove('flash'));
    state[pick.id] = true; rolling = false; $('art').classList.remove('rolling');
    setStatus(`Beginning of combat: Crystalline Giant gets a ${pick.name} counter (1 of ${pool.length} possible).`);
    addLog(`Roll ${rollNo}: ${pick.name}  (chance 1/${pool.length})`);
    render(pick.id);
  };
  if (pool.length === 1){ finish(); return; }

  /* short "slot machine" highlight through the remaining kinds, then land on the pick */
  rolling = true; $('art').classList.add('rolling'); setStatus('Rolling…');
  /* random jumps between the remaining kinds (never the same one twice in a row);
     the last highlight is always the actual result */
  let steps = 10 + randIndex(pool.length), prev = -1, delay = 50;
  const pickIdx = pool.indexOf(pick);
  const tick = () => {
    pool.forEach(c => $('sym-' + c.id).classList.remove('flash'));
    if (steps < 0){ finish(); return; }
    let j;
    if (steps === 0) j = pickIdx;
    else {
      /* build the allowed set explicitly (no retry loop that could spin forever);
         fall back to looser rules when few kinds remain */
      const all = pool.map((_, k) => k);
      let cand = all.filter(k => k !== prev && !(steps === 1 && k === pickIdx));
      if (!cand.length) cand = all.filter(k => k !== prev);
      if (!cand.length) cand = all;
      j = cand[randIndex(cand.length)];
    }
    $('sym-' + pool[j].id).classList.add('flash'); prev = j; steps--;
    delay *= 1.08; setTimeout(tick, steps < 0 ? 450 : delay);
  };
  tick();
});

$('reset').addEventListener('click', () => {
  if (rolling) return;
  COUNTERS.forEach(c => state[c.id] = false);
  rollNo = 0; logEl.innerHTML = '';
  setStatus('Reset: all counters removed, back to 3/3.');
  render(null);
});

render(null);
</script>
</body>
</html>
